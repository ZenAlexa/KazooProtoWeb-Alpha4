<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BroadcastChannel Test</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00ff00;
            color: #000;
        }
        .log {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 5px;
            border-left: 3px solid #00ff00;
            margin-bottom: 5px;
            background: #0a0a0a;
        }
    </style>
</head>
<body>
    <h1>BroadcastChannel 测试</h1>

    <div>
        <button id="sendBtn">发送测试消息</button>
        <button id="clearBtn">清空日志</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        const log = document.getElementById('log');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        function addLog(message, color = '#00ff00') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.borderLeftColor = color;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 检查 BroadcastChannel 支持
        if ('BroadcastChannel' in window) {
            addLog('✅ BroadcastChannel API 支持');

            const channel = new BroadcastChannel('latency-profiler');
            addLog('✅ 频道 "latency-profiler" 已创建');

            // 接收消息
            channel.onmessage = (event) => {
                addLog(`📥 收到消息: ${JSON.stringify(event.data)}`, '#ffaa00');
            };

            // 发送测试消息
            sendBtn.addEventListener('click', () => {
                const testData = {
                    type: 'report',
                    report: {
                        totalLatency: { avg: 42.5 },
                        sampleCount: 123,
                        timestamp: Date.now()
                    }
                };
                channel.postMessage(testData);
                addLog(`📤 已发送: ${JSON.stringify(testData)}`, '#0099ff');
            });

            clearBtn.addEventListener('click', () => {
                log.innerHTML = '';
                addLog('🗑️ 日志已清空');
            });

        } else {
            addLog('❌ BroadcastChannel API 不支持', '#ff0000');
            sendBtn.disabled = true;
        }
    </script>
</body>
</html>
